name: Deploy React (Vite) to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Inject static index.html & 404.html for GitHub Pages
        run: |
          CSS_FILE=$(basename $(ls -S dist/client/assets/styles-*.css 2>/dev/null | head -n 1))
          ENTRY_JS=$(basename $(ls -S dist/client/assets/index-*.js 2>/dev/null | head -n 1))

          cat <<EOF > dist/client/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Gametryx - Indie Game Showcase</title>
              <link rel="icon" type="image/png" href="./favicon.png" />
              <link rel="stylesheet" href="./assets/${CSS_FILE}" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./assets/${ENTRY_JS}"></script>
            </body>
          </html>
          EOF

          cp dist/client/index.html dist/client/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
